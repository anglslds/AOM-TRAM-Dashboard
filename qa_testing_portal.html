        .light-mode .border-neutral-700\/50, .light-mode .border-neutral-700\/60,

        .light-mode .bg-blue-900\/20 { background-color: #dbeafe !important; }
        .light-mode .bg-red-900\/50 { background-color: #fee2e2 !important; border-color: #fca5a5 !important; }

        /* ----------------------- */
        /*     PRINT STYLES        */

        @media print {

            /* Apply Light Mode overrides forcefully for print */
            body, .bg-\[\#121212\], .bg-\[\#1e1e1e\], .bg-\[\#181818\], .bg-neutral-900, .bg-neutral-800, .bg-neutral-800\/50, .bg-neutral-800\/80, .bg-black\/20 { background-color: #ffffff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .border-neutral-700, .border-neutral-700\/50, .border-neutral-700\/60, .border-neutral-700\/80, .border-neutral-800 { border-color: #e5e5e5 !important; border-width: 1px !important; }
            
            .text-white, .text-neutral-100, .text-neutral-200, .text-neutral-300, .text-neutral-400, h1, h2, h3, h4, span:not(.text-blue-400):not(.text-emerald-400):not(.text-red-400):not(.text-red-500):not(.text-amber-400):not(.text-orange-400):not(.text-teal-400):not(.text-cyan-400):not(.text-\[\#06b6d4\]):not(.text-\[\#3b82f6\]):not(.text-\[\#94a3b8\]):not(.text-\[\#475569\]), p, td, th, label { color: black !important; }
            
            input, select, textarea { border: none !important; background: transparent !important; color: black !important; padding: 0 !important; -webkit-appearance: none; box-shadow: none !important; resize: none !important; }

            .avoid-break { page-break-inside: avoid; break-inside: avoid; margin-bottom: 20px !important; }
            .printable-grid { display: grid !important; }
            .printable-rich-text { border: none !important; min-height: auto !important; padding: 0 !important; background: transparent !important; color: black !important; }
            .shadow-sm, .shadow-md, .shadow-xl { box-shadow: none !important; }
            
            .bg-cyan-900\/20 { background: #e0f2fe !important; }
            .bg-blue-900\/20 { background: #dbeafe !important; }
            .bg-blue-900\/10 { background: #f0f9ff !important; }
            
            .text-cyan-400 { color: #0369a1 !important; }
            .text-blue-400 { color: #1d4ed8 !important; }
            .text-emerald-400 { color: #15803d !important; }
            .text-red-400, .text-red-500 { color: #b91c1c !important; }

            .print-comparison-dark { background: #ffffff !important; border: 1px solid #e5e5e5 !important; }
            circle.text-neutral-700 { color: #e5e5e5 !important; }
        }

        /* Toast Animation */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
        .animate-toast { animation: slideUpFade 4s ease-in-out forwards; }

        /* Rich Text Editor Overrides for Lists */
        .printable-rich-text ul { list-style-type: disc !important; padding-left: 2rem !important; margin-bottom: 0.5rem; display: block !important; }
        .printable-rich-text ol { list-style-type: decimal !important; padding-left: 2rem !important; margin-bottom: 0.5rem; display: block !important; }
        .printable-rich-text li { margin-bottom: 0.25rem; display: list-item !important; }

        /* Make Content Editable divs highlightable like text */
        [contenteditable="true"] { user-select: text; }
        
        /* Hide scrollbar for tabs */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #121212; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #404040; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #525252; }

<body class="bg-[#121212]">
    <div id="root"></div>

    <script type="text/babel">
        // --- SUPABASE CONFIGURATION ---
        const SUPABASE_URL = 'https://drpnhzjzmaxoegzibvly.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_WFWxmJZsrtVip6Pkw-nOhg_uIPa3n32';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const { useState, useEffect, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = window.Recharts;

        // --- HELPER FUNCTIONS ---
        const calculateRowMetrics = (gt, det, tp, fp, fn) => {
            const precision = det > 0 ? tp / det : (tp + fp > 0 ? tp / (tp + fp) : 0);
            const recall = gt > 0 ? tp / gt : (tp + fn > 0 ? tp / (tp + fn) : 0);
            const f1 = (precision + recall) > 0 ? 2 * (precision * recall) / (precision + recall) : 0;
            const accuracy = (tp + fp + fn) > 0 ? tp / (tp + fp + fn) : 0;

            return {
                precision: (precision * 100).toFixed(2) + '%',
                recall: (recall * 100).toFixed(2) + '%',
                f1: (f1 * 100).toFixed(2) + '%',
                accuracy: (accuracy * 100).toFixed(2) + '%'
            };
        };

        const getMetricScoreColor = (percentString) => {
            const val = parseFloat(percentString);
            if (isNaN(val)) return 'text-white';
            if (val < 80) return 'text-red-500';
            if (val < 90) return 'text-orange-400';
            return 'text-emerald-400';
        };

        const getVersionLabel = (index, totalLength) => {
            const numerals = ['I', 'II', 'III', 'IV', 'V', 'VI'];
            if (totalLength === 2) return index === 0 ? 'Previous' : 'Latest';
            return numerals[index] || `V${index + 1}`;
        };

        // --- INITIAL STATE SCHEMAS ---
        const INITIAL_TABLE_STATE = {
            in: { gt: 0, det: 0, tp: 0, fp: 0, fn: 0 },
            out: { gt: 0, det: 0, tp: 0, fp: 0, fn: 0 },
            color: { gt: 0, det: 0, tp: 0, fp: 0, fn: 0 },
            type: { gt: 0, det: 0, tp: 0, fp: 0, fn: 0 },
            make: { gt: 0, det: 0, tp: 0, fp: 0, fn: 0 },
            model: { gt: 0, det: 0, tp: 0, fp: 0, fn: 0 }
        };

        const INITIAL_SITE = {
            id: '', 
            siteName: '',
            isUntestable: false,
            stream: JSON.parse(JSON.stringify(INITIAL_TABLE_STATE)),
            snowflake: JSON.parse(JSON.stringify(INITIAL_TABLE_STATE)),
            streamUnknowns: { color: 0, type: 0, make: 0, model: 0 },
            snowflakeUnknowns: { color: 0, type: 0, make: 0, model: 0 },
            bugDetails: '',
            evidenceImages: []
        };

        const INITIAL_REPORT = {
            id: '',
            title: '',
            description: '',
            summary: '',
            notes: '',
            actionItems: '',
            attachments: [],
            zoneAdjustmentsList: [],
            objective: '',
            environment: 'Staging',
            sensor: '',
            device: '',
            date: '',
            dateEnd: '',
            versionDet: '',
            versionAttrColor: '',
            versionAttrType: '',
            versionAttrMake: '',
            versionAttrModel: '',
            tramVersion: '',
            tramVersionDesc: '',
            servicesVersion: '',
            servicesVersionDesc: '',
            sites: [] 
        };

        // --- UI COMPONENTS ---
        const EditableCell = ({ value, onChange, onPaste, isReadOnly, textColor }) => {
            const cellRef = useRef(null);

            useEffect(() => {
                if (cellRef.current && document.activeElement !== cellRef.current) {
                    cellRef.current.innerText = value;
                }
            }, [value]);

            const handleBlur = (e) => {
                const parsed = parseInt(e.target.innerText.replace(/,/g, ''), 10);
                if (!isNaN(parsed) && parsed !== value) {
                    onChange(parsed);
                }
                e.target.innerText = !isNaN(parsed) ? parsed : value;
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault(); 
                    e.target.blur(); 
                }
            };

            return (
                <div
                    ref={cellRef}
                    contentEditable={!isReadOnly}
                    suppressContentEditableWarning={true}
                    onBlur={handleBlur}
                    onPaste={onPaste}
                    onKeyDown={handleKeyDown}
                    className={`w-full min-w-[40px] text-center p-1 bg-transparent hover:bg-neutral-800/50 focus:bg-neutral-800 border border-transparent focus:border-blue-500 rounded outline-none cursor-text transition-colors ${textColor}`}
                >
                    {value}
                </div>
            );
        };

        const RichTextEditor = ({ value, onChange, placeholder, isViewerMode }) => {
            const editorRef = useRef(null);

            useEffect(() => {
                if (editorRef.current && value !== editorRef.current.innerHTML) {
                    editorRef.current.innerHTML = value || '';
                }
            }, [value]);

            const handleInput = () => {
                if (editorRef.current) onChange(editorRef.current.innerHTML);
            };

            const execCmd = (cmd, arg = null) => {
                if (isViewerMode) return;
                document.execCommand(cmd, false, arg);
                if (editorRef.current) {
                    editorRef.current.focus();
                    handleInput();
                }
            };

            return (
                <div className="border border-neutral-700/60 rounded-xl overflow-hidden bg-[#1e1e1e] shadow-sm flex flex-col h-full min-h-[160px]">
                    {!isViewerMode && (
                        <div className="bg-neutral-800 border-b border-neutral-700/60 p-2 flex gap-2 flex-wrap items-center no-print">
                            <select onChange={(e) => execCmd('fontSize', e.target.value)} className="p-1 text-xs font-semibold border border-neutral-600 rounded bg-neutral-900 text-neutral-200 outline-none hover:bg-neutral-700 cursor-pointer" title="Font Size" defaultValue="3">
                                <option value="1">10 pt</option>
                                <option value="2">12 pt</option>
                                <option value="3">14 pt</option>
                                <option value="4">18 pt</option>
                                <option value="5">24 pt</option>
                                <option value="6">32 pt</option>
                                <option value="7">48 pt</option>
                            </select>
                            <div className="w-px h-5 bg-neutral-600 mx-1"></div>
                            <button type="button" onMouseDown={e => { e.preventDefault(); execCmd('bold'); }} className="w-7 h-7 text-neutral-300 hover:bg-neutral-700 rounded transition-colors flex items-center justify-center font-bold" title="Bold">B</button>
                            <button type="button" onMouseDown={e => { e.preventDefault(); execCmd('italic'); }} className="w-7 h-7 text-neutral-300 hover:bg-neutral-700 rounded transition-colors flex items-center justify-center italic font-serif" title="Italic">I</button>
                            <button type="button" onMouseDown={e => { e.preventDefault(); execCmd('underline'); }} className="w-7 h-7 text-neutral-300 hover:bg-neutral-700 rounded transition-colors flex items-center justify-center underline" title="Underline">U</button>
                            <div className="w-px h-5 bg-neutral-600 mx-1"></div>
                            <button type="button" onMouseDown={e => { e.preventDefault(); execCmd('insertUnorderedList'); }} className="w-7 h-7 text-neutral-300 hover:bg-neutral-700 rounded transition-colors flex items-center justify-center" title="Bullet List"><i className="fa-solid fa-list-ul"></i></button>
                            <button type="button" onMouseDown={e => { e.preventDefault(); execCmd('insertOrderedList'); }} className="w-7 h-7 text-neutral-300 hover:bg-neutral-700 rounded transition-colors flex items-center justify-center" title="Numbered List"><i className="fa-solid fa-list-ol"></i></button>
                            <div className="w-px h-5 bg-neutral-600 mx-1"></div>
                            <div className="flex items-center gap-1.5 px-1">
                            {['#ffffff', '#a3a3a3', '#3b82f6', '#ef4444', '#eab308', '#15803d', '#f97316', '#06b6d4'].map(color => (
                                <button
                                    key={color}
                                        type="button"
                                        onMouseDown={e => { e.preventDefault(); execCmd('foreColor', color); }}
                                        className={`w-5 h-5 rounded-full cursor-pointer transition-transform hover:scale-110 shadow-sm border border-transparent`}
                                        style={{ backgroundColor: color }}
                                        title={`Color`}
                                    />
                                ))}
                            </div>
                        </div>
                    )}
                    <div
                        ref={editorRef}
                        className={`flex-1 p-4 outline-none text-sm text-neutral-200 printable-rich-text ${!isViewerMode ? 'empty:before:content-[attr(data-placeholder)] empty:before:text-neutral-500' : ''}`}
                        contentEditable={!isViewerMode}
                        onInput={handleInput}
                        onBlur={handleInput}
                        data-placeholder={placeholder}
                    />
                </div>
            );
        };

        const PipelineInsightsPanel = ({ title, systemKey, site, siteIndex, unknowns, onUpdate, isViewerMode }) => {
            const attributes = ['color', 'type', 'make', 'model'];
            
            const attrColors = {
                color: 'bg-[#06b6d4] text-[#06b6d4]', // cyan
                type: 'bg-[#3b82f6] text-[#3b82f6]',  // blue
                make: 'bg-[#94a3b8] text-[#94a3b8]',  // slate-400
                model: 'bg-[#475569] text-[#475569]'  // slate-600
            };

            const baseTp = (site[systemKey]?.in?.tp || 0) + (site[systemKey]?.out?.tp || 0);
            const baseFp = (site[systemKey]?.in?.fp || 0) + (site[systemKey]?.out?.fp || 0);
            const baseGt = (site[systemKey]?.in?.gt || 0) + (site[systemKey]?.out?.gt || 0);
            const baseYieldVal = baseTp + baseFp;
            const baseYieldPct = baseGt > 0 ? (baseYieldVal / baseGt) * 100 : 0;
            const baseIsOverPredicting = baseYieldPct > 100;

            return (
                <div className="bg-[#1e1e1e] rounded-xl border border-neutral-700/60 shadow-sm p-5 avoid-break h-full flex flex-col">
                    <h3 className="font-bold text-white mb-4 text-sm uppercase tracking-wider border-b border-neutral-700/50 pb-3 shrink-0">
                        {title}
                    </h3>
                    <div className="overflow-y-auto pr-1">
                        {/* Vehicle Detection Block */}
                        <div className="flex flex-col p-4 border border-neutral-700/50 rounded-xl shadow-sm mb-4 bg-neutral-800/60 relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-1 h-full bg-purple-500/50"></div>
                            <div className="flex justify-between items-center mb-3">
                                <span className="text-[11px] font-bold text-white uppercase tracking-widest pl-2">Vehicle Detection</span>
                                <span className="text-[10px] text-neutral-400 font-medium tracking-wide">TP+FP: <span className="text-neutral-200 font-bold">{baseYieldVal}</span> / {baseGt}</span>
                            </div>
                            <div className="pl-2">
                                <div className="flex justify-between items-end mb-1">
                                    <span className="text-[10px] text-neutral-400 font-semibold uppercase tracking-wider">Detection Capacity</span>
                                    <span className={`text-[10px] font-bold ${baseIsOverPredicting ? 'text-orange-400' : 'text-neutral-200'}`}>{baseYieldPct.toFixed(1)}%</span>
                                </div>
                                <div className="w-full h-1.5 bg-neutral-900 rounded-full overflow-hidden border border-neutral-700/50">
                                    <div className={`h-full bg-purple-500 opacity-80`} style={{width: `${Math.min(baseYieldPct, 100)}%`}}></div>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-1 gap-4">
                            {attributes.map(attr => {
                                // Yield Calculations (TP + FP) vs GT
                                const tp = site[systemKey][attr]?.tp || 0;
                                const fp = site[systemKey][attr]?.fp || 0;
                                const gt = site[systemKey][attr]?.gt || 0;
                                const fnVal = site[systemKey][attr]?.fn || 0;
                                const yieldVal = tp + fp;
                                const yieldPct = gt > 0 ? (yieldVal / gt) * 100 : 0;
                                const isOverPredicting = yieldPct > 100;
                                
                                const count = unknowns[attr] || 0;
                                const unkPct = fnVal > 0 ? (count / fnVal) * 100 : 0;
                                const offset = 201.1 - (201.1 * Math.min(unkPct, 100)) / 100;

                                return (
                                    <div key={attr} className="flex flex-col p-4 border border-neutral-700/50 rounded-xl shadow-sm bg-[#121212] relative overflow-hidden group hover:border-neutral-600 transition-colors">
                                        <div className={`absolute top-0 left-0 w-1 h-full ${attrColors[attr].split(' ')[0]} opacity-50`}></div>
                                        
                                        <div className="flex justify-between items-center mb-3">
                                            <span className={`text-[11px] font-bold uppercase tracking-widest pl-2 ${attrColors[attr].split(' ')[1]}`}>{attr}</span>
                                            <span className="text-[10px] text-neutral-400 font-medium tracking-wide">TP+FP: <span className="text-neutral-200 font-bold">{yieldVal}</span> / {gt}</span>
                                        </div>
                                        
                                        <div className="pl-2 mb-4">
                                            <div className="flex justify-between items-end mb-1">
                                                <span className="text-[10px] text-neutral-400 font-semibold uppercase tracking-wider">Detection Capacity</span>
                                                <span className={`text-[10px] font-bold ${isOverPredicting ? 'text-orange-400' : 'text-neutral-200'}`}>{yieldPct.toFixed(1)}%</span>
                                            </div>
                                            <div className="w-full h-1.5 bg-neutral-900 rounded-full overflow-hidden border border-neutral-700/50">
                                                <div className={`h-full ${attrColors[attr].split(' ')[0]} opacity-80`} style={{width: `${Math.min(yieldPct, 100)}%`}}></div>
                                            </div>
                                        </div>

                                        {/* Unknowns Section */}
                                        <div className="flex items-center justify-between border-t border-neutral-700/50 pt-3">
                                            <div className="flex flex-col flex-1 pr-3">
                                                <span className="text-[10px] text-neutral-400 font-semibold uppercase tracking-wider mb-1">Unknowns (FN)</span>
                                                <div className="text-xs text-neutral-400 flex items-center gap-1.5 font-medium">
                                                    <input type="number" min="0" value={count}
                                                        readOnly={isViewerMode}
                                                        onChange={(e) => onUpdate(siteIndex, `${systemKey}Unknowns`, attr, e.target.value)}
                                                        className={`w-14 h-6 px-1.5 rounded text-white bg-neutral-900 border border-neutral-700 text-center outline-none shadow-sm ${isViewerMode ? 'border-transparent bg-transparent pl-0' : 'focus:border-blue-500'}`} />
                                                    <span className="text-neutral-500">/ {fnVal}</span>
                                                </div>
                                            </div>
                                            <div className="relative w-10 h-10 shrink-0">
                                                <span className="absolute inset-0 flex items-center justify-center text-[9px] font-bold text-neutral-300">{unkPct.toFixed(0)}%</span>
                                                <svg className="w-full h-full transform -rotate-90" viewBox="0 0 80 80">
                                                    <circle cx="40" cy="40" r="32" className="text-neutral-700" strokeWidth="12" stroke="currentColor" fill="none" />
                                                    <circle cx="40" cy="40" r="32" className={`${attrColors[attr].split(' ')[1]} transition-all duration-700 ease-out`} strokeWidth="12" strokeDasharray="201.1" strokeDashoffset={offset} strokeLinecap="round" stroke="currentColor" fill="none" />
                                                </svg>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const ModelComparisonDashboard = ({ configs, reports, isDarkMode }) => {
            const validConfigs = configs.filter(c => c.reportId);
            if (validConfigs.length < 2) {
                return (
                    <div className="text-center p-12 border border-neutral-700/60 rounded-xl bg-[#1e1e1e] mt-6">
                        <p className="text-neutral-400">Please select at least two reports in this group to generate comparison graphs.</p>
                    </div>
                );
            }

            const getMetrics = (site, sys, cat) => {
                if (!site || !site[sys] || site.isUntestable) return { precision: 0, recall: 0, f1: 0 };
                
                if (cat === 'base') {
                    const inRow = site[sys].in || {gt:0, det:0, tp:0, fp:0, fn:0};
                    const outRow = site[sys].out || {gt:0, det:0, tp:0, fp:0, fn:0};
                    const totalGt = inRow.gt + outRow.gt; 
                    const totalDet = inRow.det + outRow.det;
                    const totalTp = inRow.tp + outRow.tp;
                    const totalFp = inRow.fp + outRow.fp;
                    const totalFn = inRow.fn + outRow.fn;
                    const m = calculateRowMetrics(totalGt, totalDet, totalTp, totalFp, totalFn);
                    return { precision: parseFloat(m.precision) || 0, recall: parseFloat(m.recall) || 0, f1: parseFloat(m.f1) || 0 };
                }
                const row = site[sys][cat] || {gt:0, det:0, tp:0, fp:0, fn:0};
                const m = calculateRowMetrics(row.gt, row.det, row.tp, row.fp, row.fn);
                return { precision: parseFloat(m.precision) || 0, recall: parseFloat(m.recall) || 0, f1: parseFloat(m.f1) || 0 };
            };

            const getSiteFromConfig = (conf) => {
                const r = reports.find(r => String(r.id) === String(conf.reportId));
                if (!r || !r.sites || r.sites.length === 0) return null;
                const targetSiteId = conf.siteId || (r.sites[0].id ? String(r.sites[0].id) : 'fallback-0');
                return r.sites.find((s, idx) => (s.id ? String(s.id) : `fallback-${idx}`) === targetSiteId) || r.sites[0];
            };

            const getReportFromConfig = (conf) => reports.find(r => String(r.id) === String(conf.reportId));

            const sites = validConfigs.map(c => getSiteFromConfig(c)).filter(Boolean);
            const activeReports = validConfigs.map(c => getReportFromConfig(c)).filter(Boolean);

            if (sites.length < 2) {
                return (
                    <div className="text-center p-12 border border-neutral-700/60 rounded-xl bg-[#1e1e1e] mt-6">
                        <p className="text-neutral-400">Not enough valid site data to compare. Please ensure reports contain data.</p>
                    </div>
                );
            }

            const mappedData = validConfigs.map(c => {
                const site = getSiteFromConfig(c);
                const report = getReportFromConfig(c);
                if (!site || !report) return null;
                return { site, report };
            }).filter(Boolean);

            const baseSite = mappedData[0].site;
            const latestSite = mappedData[mappedData.length - 1].site;
            const baseRep = mappedData[0].report;
            const latestRep = mappedData[mappedData.length - 1].report;
            
            const primarySiteName = baseSite.siteName || 'Unnamed Site';
            const displaySiteHeader = ` for Site: ${primarySiteName}`;
            
            const axisTickColor = isDarkMode ? '#a3a3a3' : '#525252';
            const gridStrokeColor = isDarkMode ? '#404040' : '#e5e5e5';
            const tooltipContentStyle = { 
                backgroundColor: isDarkMode ? '#171717' : '#ffffff', 
                borderColor: isDarkMode ? '#404040' : '#e5e5e5', 
                color: isDarkMode ? 'white' : '#171717', 
                fontSize: '12px', 
                borderRadius: '8px' 
            };

            const streamData = mappedData.map((d, i) => {
                const verLabel = d.report.versionDet || `Test ${i+1}`;
                const mStream = getMetrics(d.site, 'stream', 'base');
                return { version: verLabel, fullLabel: `Version: ${verLabel}`, Precision: mStream.precision, Recall: mStream.recall, 'F1 Score': mStream.f1 };
            });

            const snowData = mappedData.map((d, i) => {
                const verLabel = d.report.versionDet || `Test ${i+1}`;
                const mSnow = getMetrics(d.site, 'snowflake', 'base');
                return { version: verLabel, fullLabel: `Version: ${verLabel}`, Precision: mSnow.precision, Recall: mSnow.recall, 'F1 Score': mSnow.f1 };
            });

            const generateInsights = () => {
                let strengths = [];
                let concerns = [];
                let recommendations = [];

                const diffStreamBaseF1 = getMetrics(latestSite, 'stream', 'base').f1 - getMetrics(baseSite, 'stream', 'base').f1;
                if (diffStreamBaseF1 > 2) strengths.push(`Stream Vehicle Detection F1 improved by ${diffStreamBaseF1.toFixed(1)}% (Previous to Latest).`);
                else if (diffStreamBaseF1 < -2) concerns.push(`Stream Vehicle Detection F1 regressed by ${Math.abs(diffStreamBaseF1).toFixed(1)}% (Previous to Latest).`);

                ['color', 'type', 'make', 'model'].forEach(attr => {
                    const diff = getMetrics(latestSite, 'stream', attr).f1 - getMetrics(baseSite, 'stream', attr).f1;
                    if (diff > 3) strengths.push(`${attr.charAt(0).toUpperCase() + attr.slice(1)} accuracy improved (+${diff.toFixed(1)}%).`);
                    else if (diff < -3) concerns.push(`${attr.charAt(0).toUpperCase() + attr.slice(1)} accuracy dropped (${Math.abs(diff).toFixed(1)}%).`);
                });

                if (concerns.length > 0) recommendations.push("Investigate the areas of concern closely. Check ground truth mappings.");
                if (strengths.length > 0 && concerns.length === 0) recommendations.push("Performance remains stable or improved. Model trajectory is positive.");
                if (strengths.length === 0 && concerns.length === 0) recommendations.push("Performance remains virtually identical across evaluated versions.");

                return { strengths, concerns, recommendations };
            };

            const insights = generateInsights();

            const renderMiniInsight = (newF1, oldF1, label) => {
                const diff = newF1 - oldF1;
                if (diff > 0) return <p className="text-[11px] text-neutral-400 mt-2 text-center">{label} <strong className="text-emerald-400">improved by {diff.toFixed(1)}%</strong> overall.</p>;
                if (diff < 0) return <p className="text-[11px] text-neutral-400 mt-2 text-center">{label} <strong className="text-red-400">regressed by {Math.abs(diff).toFixed(1)}%</strong> overall.</p>;
                return <p className="text-[11px] text-neutral-400 mt-2 text-center">{label} <strong className="text-neutral-300">remained stable</strong>.</p>;
            };

            const renderAttrChart = (attrName, attrKey) => {
                const data = mappedData.map((d, i) => {

                    return {

                });

                const baseM = getMetrics(mappedData[0].site, 'stream', attrKey).f1;
                const lastM = getMetrics(latestSite, 'stream', attrKey).f1;
                const baseS = getMetrics(baseSite, 'snowflake', attrKey).f1;
                const lastS = getMetrics(latestSite, 'snowflake', attrKey).f1;

                return (
                    <div className="bg-[#1e1e1e] border border-neutral-700/60 rounded-xl p-5 shadow-sm flex flex-col justify-between">
                        <div>

                                <div className="text-[10px] font-mono text-neutral-400 flex flex-col items-end">
                                    <span>Prev: {mappedData[0].report[`versionAttr${attrName}`] || mappedData[0].report.versionDet || 'Unknown'}</span>
                                    <span className="text-blue-400 mt-0.5">Latest: {mappedData[mappedData.length - 1].report[`versionAttr${attrName}`] || mappedData[mappedData.length - 1].report.versionDet || 'Unknown'}</span>
                                </div>
                            </div>
                            <div className="h-44">
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={data} margin={{ top: 10, right: 10, left: -25, bottom: 0 }}>
                                        <CartesianGrid strokeDasharray="3 3" stroke={gridStrokeColor} vertical={false} />
                                        <XAxis dataKey="version" stroke={axisTickColor} tick={{fontSize: 9, fill: axisTickColor}} axisLine={{stroke: gridStrokeColor}} tickLine={false} />
                                        <YAxis stroke={axisTickColor} domain={[0, 100]} tick={{fontSize: 10, fill: axisTickColor}} axisLine={{stroke: gridStrokeColor}} tickLine={false} />
                                        <Tooltip contentStyle={tooltipContentStyle} cursor={{ stroke: isDarkMode ? '#404040' : '#e5e5e5', strokeWidth: 1 }} labelFormatter={(l, p) => p?.[0]?.payload?.fullLabel || l} />
                                        <Legend wrapperStyle={{fontSize: '11px', color: axisTickColor, paddingTop: '8px'}} iconType="circle" iconSize={8} />
                                        <Line type="monotone" dataKey="Stream" stroke="#06b6d4" strokeWidth={2} dot={{r: 4}} activeDot={{r: 6}} />
                                        <Line type="monotone" dataKey="Snowflake" stroke="#3b82f6" strokeWidth={2} dot={{r: 4}} activeDot={{r: 6}} />
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                        <div className="mt-3 text-center border-t border-neutral-700/50 pt-3 flex flex-col gap-0.5">
                            {renderMiniInsight(lastM, baseM, `Stream ${attrName}`)}
                            {renderMiniInsight(lastS, baseS, `Snowflake ${attrName}`)}
                        </div>
                    </div>
                );
            };

            return (
                <div className="w-full font-sans relative">
                    <div className="mb-6 border-b border-neutral-700 pb-4">
                        <h2 className="text-xl font-bold text-white flex items-center gap-3 mb-1 tracking-tight">
                            <i className="fa-solid fa-chart-simple text-blue-500"></i> Version Comparison Analysis{displaySiteHeader}
                        </h2>
                        <p className="text-xs text-neutral-400 font-medium">
                            Detailed breakdown of Vehicle Detection models and independent Vehicle Attribute versions across {mappedData.length} iterations.
                        </p>
                    </div>

                    <div className="mb-8">
                        <div className="flex justify-between items-end border-b border-neutral-700 pb-2 mb-4">
                            <h3 className="text-sm font-bold text-white tracking-wide">1. Vehicle Detection (Ground Truth vs Pipelines)</h3>
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                            <div className="bg-[#1e1e1e] border border-neutral-700/60 rounded-xl p-4 shadow-sm flex flex-col justify-between">
                                <div>
                                    <h4 className="font-bold text-white text-sm tracking-wide mb-4 flex items-center gap-2">
                                        <i className="fa-solid fa-water text-cyan-400"></i> Stream Pipeline
                                    </h4>
                                    <div className="h-48">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <LineChart data={streamData} margin={{ top: 10, right: 10, left: -25, bottom: 0 }}>
                                                <CartesianGrid strokeDasharray="3 3" stroke={gridStrokeColor} vertical={false} />
                                                <XAxis dataKey="version" stroke={axisTickColor} tick={{fontSize: 9, fill: axisTickColor}} axisLine={{stroke: gridStrokeColor}} tickLine={false} />
                                                <YAxis stroke={axisTickColor} domain={[0, 100]} tick={{fontSize: 10, fill: axisTickColor}} axisLine={{stroke: gridStrokeColor}} tickLine={false} />
                                                <Tooltip contentStyle={tooltipContentStyle} cursor={{ stroke: isDarkMode ? '#404040' : '#e5e5e5', strokeWidth: 1 }} labelFormatter={(l, p) => p?.[0]?.payload?.fullLabel || l} />
                                                <Legend wrapperStyle={{fontSize: '11px', color: axisTickColor, paddingTop: '10px'}} iconType="circle" iconSize={8} />
                                                <Line type="monotone" dataKey="Precision" stroke="#737373" strokeWidth={2} dot={{r: 4}} activeDot={{r: 6}} />
                                                <Line type="monotone" dataKey="Recall" stroke="#f59e0b" strokeWidth={2} dot={{r: 4}} activeDot={{r: 6}} />
                                                <Line type="monotone" dataKey="F1 Score" stroke="#3b82f6" strokeWidth={3} dot={{r: 4}} activeDot={{r: 6}} />
                                            </LineChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                                <div className="mt-3 text-center border-t border-neutral-700/50 pt-3">
                                    {renderMiniInsight(getMetrics(mappedData[mappedData.length - 1].site, 'stream', 'base').f1, getMetrics(mappedData[0].site, 'stream', 'base').f1, "Stream Vehicle Det. F1 Score")}
                                </div>
                            </div>
                            
                            <div className="bg-[#1e1e1e] border border-neutral-700/60 rounded-xl p-4 shadow-sm flex flex-col justify-between">
                                <div>
                                    <h4 className="font-bold text-white text-sm tracking-wide mb-4 flex items-center gap-2">
                                        <i className="fa-solid fa-snowflake text-blue-400"></i> Snowflake Pipeline
                                    </h4>
                                    <div className="h-48">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <LineChart data={snowData} margin={{ top: 10, right: 10, left: -25, bottom: 0 }}>
                                                <CartesianGrid strokeDasharray="3 3" stroke={gridStrokeColor} vertical={false} />
                                                <XAxis dataKey="version" stroke={axisTickColor} tick={{fontSize: 9, fill: axisTickColor}} axisLine={{stroke: gridStrokeColor}} tickLine={false} />
                                                <YAxis stroke={axisTickColor} domain={[0, 100]} tick={{fontSize: 10, fill: axisTickColor}} axisLine={{stroke: gridStrokeColor}} tickLine={false} />
                                                <Tooltip contentStyle={tooltipContentStyle} cursor={{ stroke: isDarkMode ? '#404040' : '#e5e5e5', strokeWidth: 1 }} labelFormatter={(l, p) => p?.[0]?.payload?.fullLabel || l} />
                                                <Legend wrapperStyle={{fontSize: '11px', color: axisTickColor, paddingTop: '10px'}} iconType="circle" iconSize={8} />
                                                <Line type="monotone" dataKey="Precision" stroke="#737373" strokeWidth={2} dot={{r: 4}} activeDot={{r: 6}} />
                                                <Line type="monotone" dataKey="Recall" stroke="#f59e0b" strokeWidth={2} dot={{r: 4}} activeDot={{r: 6}} />
                                                <Line type="monotone" dataKey="F1 Score" stroke="#3b82f6" strokeWidth={3} dot={{r: 4}} activeDot={{r: 6}} />
                                            </LineChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                                <div className="mt-3 text-center border-t border-neutral-700/50 pt-3">
                                    {renderMiniInsight(getMetrics(mappedData[mappedData.length - 1].site, 'snowflake', 'base').f1, getMetrics(mappedData[0].site, 'snowflake', 'base').f1, "Snowflake Vehicle Det. F1 Score")}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="mb-8">
                        <div className="border-b border-neutral-700 pb-2 mb-4">
                            <h3 className="text-sm font-bold text-white tracking-wide">2. Vehicle Attributes (F1 Score)</h3>
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                            {renderAttrChart('Color', 'color')}
                            {renderAttrChart('Type', 'type')}
                            {renderAttrChart('Make', 'make')}
                            {renderAttrChart('Model', 'model')}
                        </div>
                    </div>

                    <div>
                        <div className="border-b border-neutral-700 pb-2 mb-4">
                            <h3 className="text-sm font-bold text-white tracking-wide flex items-center gap-2">
                                <i className="fa-solid fa-wand-magic-sparkles text-purple-400"></i> 3. Automated Insights & Recommendations
                            </h3>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-[#1e1e1e] border border-green-900/60 rounded-xl p-4 shadow-sm h-full flex flex-col">
                                <h4 className="font-bold text-green-400 text-[10px] uppercase tracking-wider mb-3 flex items-center gap-2">
                                    <i className="fa-solid fa-arrow-trend-up text-xs"></i> Strengths (Prev vs Latest)
                                </h4>
                                {insights.strengths.length === 0 ? (
                                    <p className="text-neutral-500 text-xs italic">No significant improvements detected overall.</p>
                                ) : (
                                    <ul className="text-neutral-300 text-xs space-y-2 list-disc pl-4 marker:text-green-500">
                                        {insights.strengths.map((text, i) => <li key={i}>{text}</li>)}
                                    </ul>
                                )}
                            </div>
                            
                            <div className="bg-[#1e1e1e] border border-red-900/60 rounded-xl p-4 shadow-sm h-full flex flex-col">
                                <h4 className="font-bold text-red-400 text-[10px] uppercase tracking-wider mb-3 flex items-center gap-2">
                                    <i className="fa-solid fa-arrow-trend-down text-xs"></i> Areas of Concern (Prev vs Latest)
                                </h4>
                                {insights.concerns.length === 0 ? (
                                    <p className="text-neutral-500 text-xs italic">No significant regressions detected. Stable build.</p>
                                ) : (
                                    <ul className="text-neutral-300 text-xs space-y-2 list-disc pl-4 marker:text-red-500">
                                        {insights.concerns.map((text, i) => <li key={i}>{text}</li>)}
                                    </ul>
                                )}
                            </div>

                            <div className="bg-[#1e1e1e] border border-blue-900/60 rounded-xl p-4 shadow-sm h-full flex flex-col">
                                <h4 className="font-bold text-blue-400 text-[10px] uppercase tracking-wider mb-3 flex items-center gap-2">
                                    <i className="fa-solid fa-lightbulb text-xs"></i> Recommended Actions
                                </h4>
                                <ul className="text-neutral-300 text-xs space-y-2 list-disc pl-4 marker:text-blue-500">
                                    {insights.recommendations.map((text, i) => <li key={i}>{text}</li>)}
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [reports, setReports] = useState(() => {
                if (window.__PRELOADED_REPORTS__) return window.__PRELOADED_REPORTS__;
                return []; 
            });
            
            const [isDbLoaded, setIsDbLoaded] = useState(!!window.__PRELOADED_REPORTS__);
            const [isDarkMode, setIsDarkMode] = useState(true);

            useEffect(() => {
                if (isDarkMode) {
                    document.body.classList.remove('light-mode');
                } else {
                    document.body.classList.add('light-mode');
                }
            }, [isDarkMode]);

            const [activeTab, setActiveTab] = useState('overview');
            const [currentReport, setCurrentReport] = useState(null);
            
            // Cloud Sync States
            const [isCloudModalOpen, setIsCloudModalOpen] = useState(false);
            const [cloudReports, setCloudReports] = useState([]);
            const [isSaving, setIsSaving] = useState(false);

            // Cloud Functions
            const syncAllToCloud = async () => {
                if (reports.length === 0) {
                    showToast("No local reports to sync.");
                    return;
                }
                setIsSaving(true);
                let successCount = 0;
                let errorCount = 0;
                
                showToast(`Syncing ${reports.length} reports to cloud... Please wait.`);

                // Loop through and save one by one to avoid Payload/Timeout limits
                for (const report of reports) {
                    const payload = {
                        title: report.title || `QA Report - ${report.date || new Date().toLocaleDateString()}`, 
                        data: report, 
                        updated_at: new Date()
                    };
                    const { error } = await supabase.from('qa_reports').insert(payload);
                    if (error) {
                        console.error("Error saving report", report.title, error);
                        errorCount++;
                    } else {
                        successCount++;
                    }
                }
                
                setIsSaving(false);
                if (errorCount > 0) {
                    alert(`Sync complete with errors. Successfully saved ${successCount}, failed ${errorCount}. See console.`);
                } else {
                    showToast(`Successfully synced all ${successCount} reports to the cloud!`);
                }
            };

            const saveCurrentToCloud = async () => {
                if (!currentReport) return;
                setIsSaving(true);
                const payload = {
                    title: currentReport.title || `QA Report - ${currentReport.date || new Date().toLocaleDateString()}`, 
                    data: currentReport, 
                    updated_at: new Date()
                };
                const { error } = await supabase.from('qa_reports').insert(payload);
                setIsSaving(false);
                if (error) alert('Error saving: ' + error.message);
                else showToast('Report successfully saved to Supabase!');
            };

            const fetchCloudReports = async () => {
                const { data, error } = await supabase.from('qa_reports').select('id, title, updated_at').order('updated_at', { ascending: false });
                if (!error && data) {
                    setCloudReports(data);
                    setIsCloudModalOpen(true);
                } else alert('Failed to fetch reports.');
            };

            const loadFromCloud = async (id) => {
                const { data, error } = await supabase.from('qa_reports').select('data').eq('id', id).single();
                if (data && data.data) {
                    const loadedReport = data.data;
                    setReports(prev => {
                        const exists = prev.find(r => r.id === loadedReport.id);
                        if (exists) return prev.map(r => r.id === loadedReport.id ? loadedReport : r);
                        return [loadedReport, ...prev];
                    });
                    setIsCloudModalOpen(false);
                    showToast('Report successfully loaded into your dashboard!');
                } else {
                    alert('Failed to load data from cloud.');
                }
            };

            const [compareConfigs, setCompareConfigs] = useState(() => {
                const preloaded = window.__PRELOADED_COMPARE__;
                if (preloaded) {
                    if (Array.isArray(preloaded) && preloaded.length > 0 && Array.isArray(preloaded[0])) return preloaded;
                    if (Array.isArray(preloaded) && preloaded.length > 0 && preloaded[0].reportId !== undefined) return [preloaded];
                }
                return [ [{ reportId: '', siteId: '' }, { reportId: '', siteId: '' }] ];
            });

            const [overviewReportId, setOverviewReportId] = useState('');
            const [overviewSiteId, setOverviewSiteId] = useState('all');
            const [toastMsg, setToastMsg] = useState('');
            const [isGeneratingAI, setIsGeneratingAI] = useState(null);
            const [customApiKey, setCustomApiKey] = useState(() => localStorage.getItem('custom_gemini_api_key') || '');
            const [showApiModal, setShowApiModal] = useState(false);
            const [testerName, setTesterName] = useState(() => localStorage.getItem('qa_tester_name') || '');

            const isReadOnly = !!window.__PRELOADED_REPORTS__;
            const viewerModeType = window.__VIEWER_MODE__ || 'interactive';
            const isOnePager = isReadOnly && viewerModeType === 'onepager';

            const getSafeId = (site, index) => site?.id ? String(site.id) : `fallback-${index}`;

            useEffect(() => {
                if (window.__PRELOADED_REPORTS__) return;

                const loadLocalData = async () => {
                    try {
                        let data = await window.localforage.getItem('qa_reports');
                        
                        if (!data) {
                            const legacy = localStorage.getItem('qa_reports');
                            if (legacy) {
                                data = JSON.parse(legacy);
                                await window.localforage.setItem('qa_reports', data);
                            }
                        }

                        if (data && Array.isArray(data)) {
                            let parsed = data.map(rep => {
                                const s0 = rep.sites?.[0] || {};
                                
                                // Migrate global fields upwards for backward compatibility
                                const newRep = {
                                    id: rep.id,
                                    title: rep.title || '',
                                    description: rep.description || '',
                                    summary: rep.summary || '',
                                    notes: rep.notes || '',
                                    actionItems: rep.actionItems || '',
                                    attachments: rep.attachments || [],
                                    zoneAdjustmentsList: rep.zoneAdjustmentsList || [],
                                    objective: rep.objective || s0.objective || '',
                                    environment: rep.environment || s0.environment || 'Staging',
                                    sensor: rep.sensor || s0.sensor || '',
                                    device: rep.device || s0.device || '',
                                    date: rep.date || s0.date || '',
                                    dateEnd: rep.dateEnd || s0.dateEnd || '',
                                    versionDet: rep.versionDet || s0.versionDet || '',
                                    versionAttrColor: rep.versionAttrColor || s0.versionAttrColor || '',
                                    versionAttrType: rep.versionAttrType || s0.versionAttrType || '',
                                    versionAttrMake: rep.versionAttrMake || s0.versionAttrMake || '',
                                    versionAttrModel: rep.versionAttrModel || s0.versionAttrModel || '',
                                    tramVersion: rep.tramVersion || s0.tramVersion || '',
                                    tramVersionDesc: rep.tramVersionDesc || s0.tramVersionDesc || '',
                                    servicesVersion: rep.servicesVersion || s0.servicesVersion || '',
                                    servicesVersionDesc: rep.servicesVersionDesc || s0.servicesVersionDesc || '',
                                };
                                
                                newRep.sites = (rep.sites || [s0]).map((s, idx) => {
                                    return {
                                        id: s.id || 'legacy-' + Date.now().toString() + '-' + Math.random().toString(36).substr(2, 5),
                                        siteName: s.siteName || (idx === 0 && rep.site ? rep.site : `Site ${idx + 1}`),
                                        isUntestable: s.isUntestable || false,
                                        stream: s.stream || JSON.parse(JSON.stringify(INITIAL_TABLE_STATE)),
                                        snowflake: s.snowflake || JSON.parse(JSON.stringify(INITIAL_TABLE_STATE)),
                                        streamUnknowns: s.streamUnknowns || { color: 0, type: 0, make: 0, model: 0 },
                                        snowflakeUnknowns: s.snowflakeUnknowns || { color: 0, type: 0, make: 0, model: 0 },
                                        bugDetails: s.bugDetails || '',
                                        evidenceImages: s.evidenceImages || []
                                    };
                                });
                                return newRep;
                            });
                            setReports(parsed);
                        }
                    } catch (err) {
                        console.error("Error loading reports from database:", err);
                    } finally {
                        setIsDbLoaded(true);
                    }
                };

                loadLocalData();
            }, []);

            useEffect(() => {
                if (!isReadOnly && isDbLoaded) {
                    window.localforage.setItem('qa_reports', reports).catch(err => {
                        console.error("Failed to save to local database:", err);
                    });

            const sortedReports = [...reports].sort((a, b) => {

                const dateB = b.date || b.sites?.[0]?.date || '0';

            });

            useEffect(() => {

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 4500);
            };

            const handleSave = () => {
                if (isReadOnly) return;
                setReports(prev => {
                    const exists = prev.find(r => r.id === currentReport.id);
                    if (exists) {
                        return prev.map(r => r.id === currentReport.id ? currentReport : r);
                    } else {
                        return [{...currentReport, id: Date.now().toString()}, ...prev];
                    }
                });
                showToast("Report saved successfully locally!");
            };

            const handleExportViewer = (mode) => {
                try {
                    showToast(`Generating Standalone Viewer (${mode})...`);
                    const html = document.documentElement.outerHTML;
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const root = doc.getElementById('root');
                    if (root) root.innerHTML = '';
                    doc.querySelectorAll('script').forEach(s => {
                        const isBabelSource = s.getAttribute('type') === 'text/babel';
                        const isExternal = s.hasAttribute('src');
                        const isPreload = s.id === 'preloaded-data-script';
                        if (!isBabelSource && !isExternal && !isPreload) s.remove();
                    });

                    const oldPreload = doc.getElementById('preloaded-data-script');
                    if (oldPreload) oldPreload.remove();

                    const preloadScript = doc.createElement('script');
                    preloadScript.id = 'preloaded-data-script';
                    preloadScript.textContent = `
                        window.__PRELOADED_REPORTS__ = ${JSON.stringify(reports)};
                        window.__PRELOADED_COMPARE__ = ${JSON.stringify(compareConfigs)};
                        window.__VIEWER_MODE__ = '${mode}';
                    `;
                    doc.head.insertBefore(preloadScript, doc.head.firstChild);

                    const finalHtml = "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
                    const blob = new Blob([finalHtml], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    const dateStr = new Date().toISOString().split('T')[0];
                    a.download = mode === 'onepager' ? `QA_1Pager_Viewer_${dateStr}.html` : `QA_Dashboard_Viewer_${dateStr}.html`;
                    a.click();
                    URL.revokeObjectURL(url);
                    setTimeout(() => showToast("Viewer HTML file downloaded! Ready to share."), 1000);
                } catch (err) {
                    showToast("Failed to export viewer. Check console.");
                }
            };

            const handleUpdateSiteField = (siteId, field, value) => {
                if (isReadOnly) return;
                setCurrentReport(prev => ({
                    ...prev,
                    sites: prev.sites.map(s => s.id === siteId ? { ...s, [field]: value } : s)
                }));
            };

            const handleUpdateReportField = (field, value) => {
                if (isReadOnly) return;
                setCurrentReport(prev => ({ ...prev, [field]: value }));
            };

            const handleUpdateNested = (siteId, systemKey, category, field, value) => {
                if (isReadOnly) return;
                const num = parseInt(value) || 0;
                
                setCurrentReport(prev => {
                    const newSites = prev.sites.map(s => {
                        if (s.id !== siteId) return s;
                        let updatedSite = JSON.parse(JSON.stringify(s));
                        
                        const prevValue = updatedSite[systemKey][category][field];
                        const shouldSync = prevValue === 0;

                        updatedSite[systemKey][category][field] = num;

                        if (shouldSync) {
                            if (field === 'gt') {
                                ['in', 'out', 'color', 'type', 'make', 'model'].forEach(cat => {
                                    updatedSite.stream[cat].gt = num;
                                    updatedSite.snowflake[cat].gt = num;
                                });
                            } 
                            else if (category === 'in') {
                                updatedSite[systemKey].out[field] = num;
                                if (systemKey === 'stream') {
                                    updatedSite.snowflake.in[field] = num;
                                    updatedSite.snowflake.out[field] = num;
                                }
                            }
                            else if (category === 'out') {
                                updatedSite[systemKey].in[field] = num;
                                if (systemKey === 'stream') {
                                    updatedSite.snowflake.out[field] = num;
                                    updatedSite.snowflake.in[field] = num;
                                }
                            }
                            else {
                                if (systemKey === 'stream') {
                                    updatedSite.snowflake[category][field] = num;
                                }
                            }
                        }
                        
                        return updatedSite;
                    });
                    return { ...prev, sites: newSites };
                });
            };

            const handleUpdateUnknowns = (siteIndex, systemObj, attr, value) => {
                if (isReadOnly) return;
                const num = parseInt(value) || 0;
                setCurrentReport(prev => ({
                    ...prev,
                    sites: prev.sites.map((s, idx) => {
                        if (idx !== siteIndex) return s;
                        let updatedSite = JSON.parse(JSON.stringify(s));
                        updatedSite[systemObj][attr] = num;
                        
                        if (systemObj === 'streamUnknowns') {
                            updatedSite.snowflakeUnknowns[attr] = num;
                        }
                        return updatedSite;
                    })
                }));
            };

            const handleAddSite = () => {
                if (isReadOnly) return;
                const newSite = JSON.parse(JSON.stringify(INITIAL_SITE));
                newSite.id = Date.now().toString();
                setCurrentReport(prev => ({
                    ...prev,
                    sites: [...prev.sites, newSite]
                }));
                showToast("New blank site block added to report!");
            };

            const handleDeleteSite = (siteId) => {
                if (isReadOnly) return;
                if (currentReport.sites.length === 1) {
                    showToast("A report must have at least one site.");
                    return;
                }
                setCurrentReport(prev => ({
                    ...prev,
                    sites: prev.sites.filter(s => s.id !== siteId)
                }));
            };

            const copyFromStream = (siteId) => {
                if (isReadOnly) return;
                setCurrentReport(prev => ({
                    ...prev,
                    sites: prev.sites.map(s => s.id === siteId ? {
                        ...s,
                        snowflake: JSON.parse(JSON.stringify(s.stream)),
                        snowflakeUnknowns: JSON.parse(JSON.stringify(s.streamUnknowns))
                    } : s)
                }));
                showToast("Forced synced Stream data to Snowflake!");
            };
            
            const cloneInToOut = (siteId, systemKey) => {
                if (isReadOnly) return;
                setCurrentReport(prev => ({
                    ...prev,
                    sites: prev.sites.map(s => {
                        if (s.id !== siteId) return s;
                        let updatedSite = JSON.parse(JSON.stringify(s));
                        updatedSite[systemKey].out = JSON.parse(JSON.stringify(updatedSite[systemKey].in));
                        if (systemKey === 'stream') {
                            updatedSite.snowflake.out = JSON.parse(JSON.stringify(updatedSite.stream.in));
                        }
                        return updatedSite;
                    })
                }));
                showToast(`Cloned IN row to OUT row for ${systemKey.toUpperCase()}`);
            };

            const handleTablePaste = (e, siteId, systemKey, startCategory, startField) => {
                if (isReadOnly) return;
                const pasteData = e.clipboardData.getData('text');
                
                if (!pasteData.includes('\t') && !pasteData.includes('\n')) return; 

                e.preventDefault();

                const categories = ['in', 'out', 'color', 'type', 'make', 'model'];
                const fields = ['gt', 'det', 'tp', 'fp', 'fn'];
                
                const startCatIdx = categories.indexOf(startCategory);
                const startFieldIdx = fields.indexOf(startField);

                const rows = pasteData.split(/\r?\n/).map(r => r.split('\t'));

                setCurrentReport(prev => {
                    const newSites = prev.sites.map(s => {
                        if (s.id !== siteId) return s;

                        let updatedSite = JSON.parse(JSON.stringify(s));
                        let gtUpdatedTo = null;
                        let didSyncGt = false;

                        rows.forEach((rowVals, rIdx) => {
                            const targetCat = categories[startCatIdx + rIdx];
                            if (!targetCat) return;

                            rowVals.forEach((val, cIdx) => {
                                const targetField = fields[startFieldIdx + cIdx];
                                if (!targetField) return;

                                const num = parseInt(val.trim().replace(/,/g, ''), 10);
                                if (!isNaN(num)) {
                                    const prevValue = updatedSite[systemKey][targetCat][targetField];
                                    const shouldSync = prevValue === 0;

                                    updatedSite[systemKey][targetCat][targetField] = num;
                                    
                                    if (targetField === 'gt' && shouldSync) {
                                        gtUpdatedTo = num;
                                        didSyncGt = true;
                                    }

                                    if (shouldSync) {
                                        if (systemKey === 'stream') {
                                            updatedSite.snowflake[targetCat][targetField] = num;
                                        }
                                        if (targetCat === 'in') {
                                            updatedSite[systemKey].out[targetField] = num;
                                            if (systemKey === 'stream') updatedSite.snowflake.out[targetField] = num;
                                        } else if (targetCat === 'out') {
                                            updatedSite[systemKey].in[targetField] = num;
                                            if (systemKey === 'stream') updatedSite.snowflake.in[targetField] = num;
                                        }
                                    }
                                }
                            });
                        });

                        if (didSyncGt && gtUpdatedTo !== null) {
                            ['in', 'out', 'color', 'type', 'make', 'model'].forEach(cat => {
                                updatedSite.stream[cat].gt = gtUpdatedTo;
                                updatedSite.snowflake[cat].gt = gtUpdatedTo;
                            });
                        }

                        return updatedSite;
                    });
                    return { ...prev, sites: newSites };
                });
                showToast("Grid pasted & synced successfully!");
            };

            const handleGenerateAI = async (field) => {
                if (isReadOnly) return;
                if (!customApiKey.trim()) {
                    setShowApiModal(true);
                    return;
                }
                
                setIsGeneratingAI(field);
                showToast("AI is analyzing test data... this might take a few seconds.");
                
                try {
                    const reportDataForAI = {
                        title: currentReport.title,
                        description: currentReport.description,
                        summary: currentReport.summary,
                        testInfo: {
                            objective: currentReport.objective,
                            environment: currentReport.environment,
                            sensor: currentReport.sensor,
                            device: currentReport.device,
                            tramVersion: currentReport.tramVersion,
                            servicesVersion: currentReport.servicesVersion,
                        },
                        sites: currentReport.sites.map(s => {
                            const cleanSite = { ...s };
                            if (cleanSite.evidenceImages) {
                                cleanSite.evidenceImages = cleanSite.evidenceImages.map(img => ({
                                    description: typeof img === 'string' ? '' : img.description,
                                    bugType: typeof img === 'string' ? 'none' : img.bugType
                                }));
                            }
                            return cleanSite;
                        })
                    };

                    const fieldName = field === 'notes' ? 'Overall QA Notes' : 'Overall Recommendations / Action Items';
                    
                    const systemPrompt = "You are an expert QA Analyst evaluating an AI vehicle detection system (TRAM). You receive test results comparing two pipelines: 'Stream' and 'Snowflake'. Your task is to analyze the provided JSON data and write the '" + fieldName + "' section for the final report. Output ONLY valid, clean HTML code (using <p>, <ul>, <li>, <strong>). DO NOT use markdown code blocks like ```html. Be professional, analytical, and concise.";
                    
                    const userPrompt = "Generate the " + fieldName + " based on this data:\n" + JSON.stringify(reportDataForAI);

                    const payload = {
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                    };
                    
                    const apiKey = customApiKey.trim(); 
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    let response;
                    let retries = 3;
                    let delay = 1000;
                    
                    for (let i = 0; i < retries; i++) {
                        response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        
                        if (response.ok) break;
                        
                        if (response.status === 429 && i < retries - 1) {
                            await new Promise(res => setTimeout(res, delay));
                            delay *= 2;
                        } else {
                            const errRes = await response.json();
                            if (response.status === 400 && errRes.error?.message?.toLowerCase().includes("api key")) {
                                setShowApiModal(true);
                                throw new Error("API Key required or invalid. Please check your settings.");
                            }
                            throw new Error(errRes.error?.message || `HTTP ${response.status}`);
                        }
                    }

                    const result = await response.json();
                    const candidate = result.candidates?.[0];

                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        let htmlText = candidate.content.parts[0].text;
                        htmlText = htmlText.replace(/^```html/gm, '').replace(/^```/gm, '').trim();
                        
                        setCurrentReport(prev => ({ ...prev, [field]: htmlText }));
                        showToast(`AI successfully generated ${fieldName}!`);
                    } else {
                        console.error("AI Generation Result Error:", result);
                        const blockReason = result.promptFeedback?.blockReason;
                        const errorMsg = blockReason ? `Blocked by safety filter: ${blockReason}` : "Model returned empty content.";
                        showToast(`Generation failed: ${errorMsg}`);
                    }
                } catch (err) {
                    console.error("AI Generation Error:", err);
                    showToast(`AI Error: ${err.message}`);
                } finally {
                    setIsGeneratingAI(null);
                }
            };

            if (!isDbLoaded) {
                return (
                    <div className="min-h-screen bg-[#121212] flex items-center justify-center">
                        <div className="text-neutral-400 flex flex-col items-center gap-4">
                            <i className="fa-solid fa-circle-notch fa-spin text-3xl text-blue-500"></i>
                            <span className="font-semibold tracking-wider text-sm uppercase">Loading Database...</span>
                        </div>
                    </div>
                );
            }

            const apiModal = showApiModal ? (
                <div className="fixed inset-0 bg-black/60 z-[300] flex items-center justify-center p-4 no-print">
                    <div className="bg-[#1e1e1e] border border-neutral-700 p-6 rounded-xl shadow-2xl max-w-md w-full animate-in zoom-in-95 duration-200">
                        <h3 className="text-xl font-bold text-white mb-2">Configure Gemini API Key</h3>

                            <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-blue-400 hover:underline">Get a free key here</a>.

                        />
                        <div className="flex justify-end gap-3">

                        </div>
                    </div>
                </div>

                                            <div>

                                                Load Local
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            ) : null;

            const renderTable = (site, systemName, systemKey, colorClass, bgClass) => {
                const data = site[systemKey];
                
                const totalGt = data.in.gt + data.out.gt;
                const totalDet = data.in.det + data.out.det;
                const totalTp = data.in.tp + data.out.tp;
                const totalFp = data.in.fp + data.out.fp;

                        <div className="px-5 py-3 border-b border-neutral-700/60 bg-neutral-800/50 flex justify-between items-center no-print shrink-0">

                                {systemName}

                                <button onClick={() => copyFromStream(site.id)} className="text-xs bg-blue-900/30 hover:bg-blue-900/50 text-blue-400 px-3 py-1.5 rounded transition-colors flex items-center gap-2 border border-blue-500/30 font-bold shadow-sm" title="Force sync if connections broke">
                                    <i className="fa-solid fa-rotate"></i> Sync from Stream

                        </div>
                        <div className="overflow-x-auto flex-1 custom-scrollbar">

                                    <tr className="bg-neutral-800 text-neutral-300 text-xs uppercase tracking-wider border-b border-neutral-700/60">

                                        <th className="p-3 font-bold">Scenario</th>
                                        <th className="p-3 font-bold text-center border-l border-neutral-700/50">GT</th>

                                        <th className="p-3 font-bold text-center border-l border-neutral-700/50">TP</th>
                                        <th className="p-3 font-bold text-center text-orange-400">FP</th>
                                        <th className="p-3 font-semibold text-center text-red-400">FN</th>

                                        {['gt', 'det', 'tp', 'fp', 'fn'].map(field => {

                                             return (
                                                 <td key={field} className="p-1 border-l border-neutral-700/50">

                                                        value={data.in[field]} 
                                                        isReadOnly={isReadOnly}
                                                        textColor={textColor}
                                                        onChange={(num) => handleUpdateNested(site.id, systemKey, 'in', field, num)}
                                                        onPaste={(e) => handleTablePaste(e, site.id, systemKey, 'in', field)}
                                                    />
                                                 </td>
                                             )
                                        })}
                                        <td className="p-3 text-center font-medium border-l border-neutral-700/50">{calculateRowMetrics(data.in.gt, data.in.det, data.in.tp, data.in.fp, data.in.fn).precision}</td>
                                        <td className="p-3 text-center font-medium">{calculateRowMetrics(data.in.gt, data.in.det, data.in.tp, data.in.fp, data.in.fn).recall}</td>
                                        <td className="p-3 text-center font-bold text-white">{calculateRowMetrics(data.in.gt, data.in.det, data.in.tp, data.in.fp, data.in.fn).f1}</td>
                                        <td className="p-3 text-center font-bold text-white">{calculateRowMetrics(data.in.gt, data.in.det, data.in.tp, data.in.fp, data.in.fn).accuracy}</td>
                                    </tr>
                                    <tr className="hover:bg-neutral-800/30 group/out">
                                        <td className="p-3 font-bold text-neutral-200 uppercase flex items-center justify-between min-w-[70px]">

                                            {!isReadOnly && (

                                        </td>
                                        {['gt', 'det', 'tp', 'fp', 'fn'].map(field => {
