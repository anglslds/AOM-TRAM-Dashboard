                                                </div>
                                            )}
                                        </div>
                                        
                                        <div className="md:col-span-2 pt-4 border-t border-neutral-700/50">
                                            <label className="text-xs font-bold text-neutral-400 uppercase tracking-wider mb-1 block">Services Version & Details</label>
                                            {isReadOnly ? (
                                                <div>
                                                    <div className="text-lg font-bold text-white mt-1">{currentReport.servicesVersion}</div>
                                                    {currentReport.servicesVersionDesc && (
                                                        <div className="text-sm text-neutral-400 mt-3 whitespace-pre-wrap leading-relaxed bg-neutral-900/40 p-3 rounded border border-neutral-800/80">
                                                            {currentReport.servicesVersionDesc}
                                                        </div>
                                                    )}
                                                </div>

                                                    <input type="text" className="w-full text-lg font-bold text-white bg-transparent outline-none transition-colors border p-1.5 -ml-1.5 focus:bg-neutral-800/50 border-transparent hover:border-neutral-700 rounded" placeholder="e.g. Genie v2.8.8-beta.7" value={currentReport.servicesVersion || ''} onChange={e => handleUpdateReportField('servicesVersion', e.target.value)} />
                                                    <textarea className="w-full text-sm text-white bg-neutral-900 outline-none resize-y transition-colors border p-3 focus:border-blue-500 border-neutral-700 rounded-lg min-h-[80px]" rows="3" placeholder="Describe specific updates..." value={currentReport.servicesVersionDesc || ''} onChange={e => handleUpdateReportField('servicesVersionDesc', e.target.value)} />
                                                </div>
                                            )}
                                        </div>

                                                    )}
                                                </div>
                                                <div>
                                                    <span className="text-[10px] text-neutral-500 block mb-0.5">Type</span>
                                                    {isReadOnly ? (
                                                        <div className="text-lg font-semibold text-white">{currentReport.versionAttrType}</div>
                                                    ) : (
                                                        <input type="text" className="w-full text-lg font-semibold p-1.5 border border-neutral-700/60 rounded bg-neutral-900 text-white focus:border-blue-500 outline-none" placeholder="Version" value={currentReport.versionAttrType} onChange={e => handleUpdateReportField('versionAttrType', e.target.value)} />
                                                    )}
                                                </div>
                                                <div>
                                                    <span className="text-[10px] text-neutral-500 block mb-0.5">Make</span>
                                                    {isReadOnly ? (
                                                        <div className="text-lg font-semibold text-white">{currentReport.versionAttrMake}</div>
                                                    ) : (
                                                        <input type="text" className="w-full text-lg font-semibold p-1.5 border border-neutral-700/60 rounded bg-neutral-900 text-white focus:border-blue-500 outline-none" placeholder="Version" value={currentReport.versionAttrMake} onChange={e => handleUpdateReportField('versionAttrMake', e.target.value)} />
                                                    )}
                                                </div>
                                                <div>
                                                    <span className="text-[10px] text-neutral-500 block mb-0.5">Model</span>
                                                    {isReadOnly ? (
                                                        <div className="text-lg font-semibold text-white">{currentReport.versionAttrModel}</div>
                                                    ) : (
                                                        <input type="text" className="w-full text-lg font-semibold p-1.5 border border-neutral-700/60 rounded bg-neutral-900 text-white focus:border-blue-500 outline-none" placeholder="Version" value={currentReport.versionAttrModel} onChange={e => handleUpdateReportField('versionAttrModel', e.target.value)} />

                                            </div>

                                        <i className="fa-solid fa-plus"></i> Add Another Site to this Report
                                    </button>
                                </div>
                            )}

                            <section className="avoid-break mb-12 mt-12">

                                            <tbody>

                                                        <td className="py-3 pr-4">
                                                            {isReadOnly ? (
                                                                <span className="text-white font-medium">{adj.siteName}</span>

                                                                <input type="text" className="w-full p-2 bg-neutral-900 border border-neutral-700 rounded text-sm text-white outline-none focus:border-blue-500" value={adj.siteName} onChange={(e) => {
                                                                    const newList = [...(currentReport.zoneAdjustmentsList || [])];
                                                                    newList[idx].siteName = e.target.value;
                                                                    setCurrentReport({...currentReport, zoneAdjustmentsList: newList});
                                                                }} placeholder="e.g. Hyperdome Level 1" />
                                                            )}
                                                        </td>
                                                        <td className="py-3 pr-4 w-1/3">
                                                            {isReadOnly ? (
                                                                <span className="text-white text-sm bg-neutral-900 px-2 py-1 rounded border border-neutral-700">{adj.date}</span>
                                                            ) : (
                                                                <input type="date" className="w-full p-2 bg-neutral-900 border border-neutral-700 rounded text-sm text-white outline-none focus:border-blue-500" value={adj.date} onChange={(e) => {
                                                                    const newList = [...(currentReport.zoneAdjustmentsList || [])];
                                                                    newList[idx].date = e.target.value;
                                                                    setCurrentReport({...currentReport, zoneAdjustmentsList: newList});
                                                                }} />
                                                            )}
                                                        </td>
                                                        {!isReadOnly && (
                                                            <td className="py-3 text-right">
                                                                <button onClick={() => {
                                                                    const newList = [...(currentReport.zoneAdjustmentsList || [])];
                                                                    newList.splice(idx, 1);
                                                                    setCurrentReport({...currentReport, zoneAdjustmentsList: newList});
                                                                }} className="text-neutral-500 hover:text-red-400 p-2 transition-colors">
                                                                    <i className="fa-solid fa-trash"></i>
                                                                </button>
                                                            </td>
                                                        )}
                                                    </tr>
                                                ))}
                                                {(!currentReport.zoneAdjustmentsList || currentReport.zoneAdjustmentsList.length === 0) && (
                                                    <tr><td colSpan="3" className="py-6 text-center text-neutral-500 italic text-sm">No zone adjustments recorded for this report.</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                    {!isReadOnly && (
                                        <div className="mt-4 border-t border-neutral-700/50 pt-4 no-print">
                                            <button onClick={() => {
                                                const newList = [...(currentReport.zoneAdjustmentsList || []), {siteName: '', date: ''}];
                                                setCurrentReport({...currentReport, zoneAdjustmentsList: newList});
                                            }} className="text-sm bg-neutral-800 hover:bg-neutral-700 text-white px-4 py-2.5 rounded-lg border border-neutral-600 transition-colors shadow-sm font-medium">
                                                <i className="fa-solid fa-plus text-orange-400 mr-2"></i> Add Zone Adjustment
                                            </button>
                                        </div>
                                    )}
                                </div>

                                            <input type="url" id="att-url" placeholder="URL (https://...)" className="flex-2 p-2.5 bg-neutral-900 border border-neutral-700 rounded-lg text-sm outline-none focus:border-blue-500 font-medium sm:w-1/2 text-white" />
                                            <button type="button" onClick={() => {
                                                const t = document.getElementById('att-title');
                                                const u = document.getElementById('att-url');
                                                if (t.value && u.value) {
                                                    setCurrentReport({...currentReport, attachments: [...(currentReport.attachments || []), {title: t.value, url: u.value}]});
                                                    t.value = ''; u.value = '';
                                                }
                                            }} className="bg-neutral-800 text-white font-bold px-5 py-2.5 rounded-lg border border-neutral-600 hover:bg-neutral-700 transition-colors whitespace-nowrap shadow-sm">
                                                Add Link
                                            </button>
                                        </div>
                                    )}
                                    
                                    <div className="space-y-3">
                                        {(!currentReport.attachments || currentReport.attachments.length === 0) ? (
                                             <p className="text-neutral-500 text-sm italic">No attachments added.</p>
                                        ) : (
                                            currentReport.attachments.map((att, idx) => (
                                                <div key={idx} className="border border-neutral-700 rounded-xl p-3 bg-neutral-900/50 flex items-center justify-between shadow-sm hover:border-blue-500/50 transition-colors group">
                                                    <a href={att.url} target="_blank" rel="noreferrer" className="flex items-center gap-4 text-blue-400 font-bold hover:underline">
                                                        <div className="bg-[#1e1e1e] w-10 h-10 flex items-center justify-center rounded-lg text-blue-400 border border-neutral-700 shadow-sm">
                                                            <i className="fa-solid fa-arrow-up-right-from-square text-sm"></i>
                                                        </div>
                                                        {att.title}
                                                    </a>
                                                    {!isReadOnly && (
                                                        <button onClick={() => setCurrentReport({...currentReport, attachments: currentReport.attachments.filter((_, i) => i !== idx)})} className="text-neutral-500 hover:text-red-400 transition-colors no-print p-2 rounded hover:bg-red-900/30" title="Remove Attachment">
                                                            <i className="fa-solid fa-xmark text-lg"></i>
                                                        </button>
                                                    )}
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>

                                        {!isReadOnly && (
                                            <button 
                                                onClick={() => handleGenerateAI('notes')} 
                                                disabled={isGeneratingAI !== null}
                                                className="text-xs bg-purple-900/30 text-purple-400 hover:bg-purple-900/50 px-3 py-1.5 rounded transition-colors border border-purple-500/30 font-bold flex items-center gap-1.5 disabled:opacity-50 disabled:cursor-not-allowed no-print"
                                                title="Auto-generate QA Notes based on report data"
                                            >
                                                {isGeneratingAI === 'notes' ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-wand-magic-sparkles"></i>}
                                                AI Auto-Fill
                                            </button>
                                        )}
                                    </div>
                                    <RichTextEditor isViewerMode={isReadOnly} value={currentReport.notes} onChange={v => setCurrentReport({...currentReport, notes: v})} placeholder="General testing notes across all sites..." />
                                </div>

                                    <div className="flex justify-between items-center mb-3 shrink-0">
                                        <h3 className="text-lg font-bold text-blue-400">Overall Recommendations</h3>

                                            <button 
                                                onClick={() => handleGenerateAI('actionItems')} 
                                                disabled={isGeneratingAI !== null}
                                                className="text-xs bg-purple-900/30 text-purple-400 hover:bg-purple-900/50 px-3 py-1.5 rounded transition-colors border border-purple-500/30 font-bold flex items-center gap-1.5 disabled:opacity-50 disabled:cursor-not-allowed no-print"
                                                title="Auto-generate Recommendations based on report data"
                                            >
                                                {isGeneratingAI === 'actionItems' ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-wand-magic-sparkles"></i>}
                                                AI Auto-Fill
                                            </button>
                                        )}
                                    </div>
                                    <RichTextEditor isViewerMode={isReadOnly} value={currentReport.actionItems} onChange={v => setCurrentReport({...currentReport, actionItems: v})} placeholder="Next steps..." />
                                </div>
                            </section>

                            {(() => {
                                const relevantComparisons = compareConfigs ? compareConfigs.filter(g => g.filter(c => c.reportId).length >= 2 && g.some(c => String(c.reportId) === String(currentReport.id))) : [];
                                if (relevantComparisons.length === 0) return null;
                                return (
                                    <section className="avoid-break mb-8 mt-8">
                                        <h2 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                                            <i className="fa-solid fa-code-compare text-purple-400"></i> Version Comparisons
                                        </h2>
                                        <div className="space-y-6">
                                            {relevantComparisons.map((group, idx) => (
                                                <div key={idx} className="bg-[#1e1e1e] border border-neutral-700/60 rounded-xl p-5 shadow-sm avoid-break">
                                                    <ModelComparisonDashboard configs={group} reports={reports} isDarkMode={isDarkMode} />
                                                </div>
                                            ))}
                                        </div>
                                    </section>
                                );
                            })()}
                        </main>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#121212] text-neutral-200 font-sans relative">
                    {apiModal}
                    {cloudModal}
                    {toastMsg && (
                        <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-neutral-800 border border-neutral-600 text-white px-5 py-3 rounded-lg shadow-2xl z-[200] flex items-center gap-3 text-sm font-medium animate-toast no-print">
                            <span>{toastMsg}</span>
                        </div>
                    )}
                    
                    <div className="max-w-[1200px] mx-auto p-4 md:p-8">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">

                                <h1 className="text-3xl font-bold text-white flex items-center gap-3">
                                    AOM TRAM Standard Testing Dashboard
                                </h1>
                                <p className="text-neutral-400 mt-2 flex items-center gap-1 flex-wrap">
                                    Manage, track, and compare test iterations | QA Tester: 
                                    <input 
                                        type="text" 
                                        value={testerName} 
                                        onChange={(e) => {
                                            setTesterName(e.target.value);
                                            localStorage.setItem('qa_tester_name', e.target.value);
                                        }}
                                        className="bg-transparent border-b border-transparent hover:border-neutral-600 focus:border-blue-500 outline-none text-neutral-300 transition-colors px-1 w-56 font-medium"
                                        placeholder="Enter Name..."

                                    {isSaving ? <i className="fa-solid fa-circle-notch fa-spin mr-2"></i> : <i className="fa-solid fa-cloud-arrow-up mr-2"></i>}
                                    {isSaving ? 'Syncing...' : 'Sync All to Cloud'}
                                </button>
                                <button onClick={fetchCloudReports} className="px-4 py-2.5 bg-neutral-700 hover:bg-neutral-600 text-white rounded-lg font-bold flex items-center transition-colors shadow-sm border border-neutral-600">
                                    <i className="fa-solid fa-cloud-arrow-down mr-2"></i> Load Cloud Report
                                </button>

                                <button onClick={() => setShowApiModal(true)} className="bg-neutral-800 hover:bg-neutral-700 text-neutral-400 px-3 py-2.5 rounded-lg font-semibold flex items-center transition-colors border border-neutral-700 shadow-sm" title="Configure AI API Key">
                                    <i className="fa-solid fa-key"></i>
                                </button>
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-white px-4 py-2.5 rounded-lg font-semibold flex items-center justify-center transition-colors shadow-sm" title="Toggle Theme">
                                    {isDarkMode ? <i className="fa-solid fa-sun text-amber-400"></i> : <i className="fa-solid fa-moon text-blue-400"></i>}
                                </button>
                                {reports.length > 0 && !isReadOnly && (
                                    <>
                                        <button onClick={() => handleExportViewer('interactive')} className="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-blue-400 px-4 py-2.5 rounded-lg font-semibold flex items-center gap-2 transition-colors shadow-sm" title="Export full interactive dashboard">
                                            <i className="fa-solid fa-layer-group"></i> Share Dashboard
                                        </button>
                                        <button onClick={() => handleExportViewer('onepager')} className="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-emerald-400 px-4 py-2.5 rounded-lg font-semibold flex items-center gap-2 transition-colors shadow-sm" title="Export latest report as 1-pager">
                                            <i className="fa-solid fa-file-lines"></i> Share 1-Pager
                                        </button>
                                    </>
                                )}
                                {!isReadOnly && (
                                    <button onClick={() => {
                                        const newReport = JSON.parse(JSON.stringify(INITIAL_REPORT));
                                        const site = JSON.parse(JSON.stringify(INITIAL_SITE));
                                        site.id = Date.now().toString();
                                        newReport.sites = [site];
                                        setCurrentReport(newReport);
                                    }} className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-semibold flex items-center gap-2 shadow-lg shadow-blue-900/20 transition-colors">
                                        <i className="fa-solid fa-plus"></i> New QA Report
                                    </button>
                                )}
                            </div>
                        </div>

                                <i className="fa-solid fa-folder-open mr-2"></i> QA Test Reports
                            </button>
                            <button onClick={() => setActiveTab('compare')} className={`px-6 py-3 font-medium text-sm transition-colors border-b-2 whitespace-nowrap ${activeTab === 'compare' ? 'border-blue-500 text-blue-400 bg-neutral-800/30' : 'border-transparent text-neutral-400 hover:text-neutral-200 hover:bg-neutral-800/20'}`}>

                                <div className="bg-blue-900/10 border border-blue-500/20 rounded-xl p-4 flex items-start gap-3 mb-6 shadow-sm">
                                    <i className="fa-solid fa-circle-info text-blue-500 mt-0.5 text-lg shrink-0"></i>
                                    <div>
                                        <h4 className="text-blue-500 font-bold text-[11px] uppercase tracking-wider mb-1">Key Note</h4>
                                        <p className="text-neutral-300 text-sm leading-relaxed">
                                            To accurately measure progress, <b>compare different model versions tested on the SAME SITE, sensor configuration, and testing conditions.</b> Changes in site setup or environment may influence the results and should not be used to evaluate model performance.
                                        </p>
                                    </div>
                                </div>
                                <div className="space-y-12">
                                    {compareConfigs.map((group, groupIdx) => {
                                        const romanLabel = getVersionLabel(groupIdx, compareConfigs.length);
                                        return (
                                        <div key={groupIdx} className="bg-[#181818] rounded-xl border border-neutral-700/60 p-6 shadow-md relative mb-8">
                                            <div className="flex justify-between items-center mb-4 border-b border-neutral-700/50 pb-4">
                                                <h3 className="text-sm font-bold text-neutral-300 uppercase tracking-wider">Version Comparison {romanLabel}</h3>
                                                <div className="flex gap-3">
                                                    {!isReadOnly && (
                                                        <button onClick={() => {
                                                            const newGroups = [...compareConfigs];
                                                            newGroups[groupIdx] = [...newGroups[groupIdx], {reportId:'', siteId:''}];
                                                            setCompareConfigs(newGroups);
                                                        }} className="text-xs bg-blue-600/20 text-blue-400 hover:bg-blue-600/40 px-3 py-1.5 rounded transition-colors border border-blue-500/30 font-bold">
                                                            <i className="fa-solid fa-plus mr-1"></i> Add Version
                                                        </button>
                                                    )}
                                                    {!isReadOnly && compareConfigs.length > 1 && (
                                                        <button onClick={() => setCompareConfigs(compareConfigs.filter((_, i) => i !== groupIdx))} className="text-xs bg-red-600/20 text-red-400 hover:bg-red-600/40 px-3 py-1.5 rounded transition-colors border border-red-500/30 font-bold">
                                                            <i className="fa-solid fa-trash mr-1"></i> Remove Set
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4 mb-6">
                                                {group.map((conf, idx) => {
                                                    const rep = reports.find(r => String(r.id) === String(conf.reportId));
                                                    
                                                    const availableSites = rep?.sites || [];
                                                    const defaultSiteId = availableSites.length > 0 ? getSafeId(availableSites[0], 0) : '';
                                                    const displaySiteId = conf.siteId || defaultSiteId;
                                                    
                                                    const versionLabel = getVersionLabel(idx, group.length);

                                                    return (
                                                        <div key={idx} className="bg-[#121212] border border-neutral-700/80 p-4 rounded-lg relative">
                                                            {!isReadOnly && group.length > 2 && (
                                                                <button onClick={() => {
                                                                    const newGroups = [...compareConfigs];
                                                                    newGroups[groupIdx] = newGroups[groupIdx].filter((_, i) => i !== idx);
                                                                    setCompareConfigs(newGroups);
                                                                }} className="absolute top-2 right-2 text-neutral-500 hover:text-red-400 transition-colors" title="Remove Version">
                                                                    <i className="fa-solid fa-xmark"></i>
                                                                </button>
                                                            )}
                                                            <div className="text-[10px] text-blue-400 font-bold uppercase tracking-wider mb-3">{versionLabel}</div>
                                                            <div className="space-y-3">
                                                                <div>
                                                                    <label className="text-[9px] text-neutral-500 font-bold uppercase tracking-wider block mb-1">Report</label>
                                                                    <select className="w-full p-2.5 rounded-lg bg-neutral-800 border border-neutral-600 text-neutral-200 text-xs outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 hover:bg-neutral-700 transition-all cursor-pointer shadow-sm" value={conf.reportId} onChange={e => {
                                                                        const newGroups = [...compareConfigs];
                                                                        const newRep = reports.find(r => String(r.id) === e.target.value);
                                                                        const autoSiteId = newRep?.sites?.[0] ? getSafeId(newRep.sites[0], 0) : '';
                                                                        newGroups[groupIdx][idx] = { reportId: e.target.value, siteId: autoSiteId };
                                                                        setCompareConfigs(newGroups);
                                                                    }}>
                                                                        <option value="">Select Report...</option>
                                                                        {reports.map(r => <option key={r.id} value={r.id}>{r.title || 'Untitled'} ({r.date || r.sites?.[0]?.date || 'No Date'})</option>)}
                                                                    </select>
                                                                </div>
                                                                <div>
                                                                    <label className="text-[9px] text-neutral-500 font-bold uppercase tracking-wider block mb-1">Site (Location)</label>
                                                                    <select className="w-full p-2.5 rounded-lg bg-neutral-800 border border-neutral-600 text-neutral-200 text-xs outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 hover:bg-neutral-700 transition-all cursor-pointer shadow-sm" value={displaySiteId} onChange={e => {
                                                                        const newGroups = [...compareConfigs];
                                                                        newGroups[groupIdx][idx].siteId = e.target.value;
                                                                        setCompareConfigs(newGroups);
                                                                    }}>
                                                                        <option value="">Select specific site...</option>
                                                                        {availableSites.map((s, i) => <option key={getSafeId(s, i)} value={getSafeId(s, i)}>{s.siteName || `Site ${i+1}`}</option>)}
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                            <ModelComparisonDashboard configs={group} reports={reports} isDarkMode={isDarkMode} />
                                        </div>
                                    )})}

                                    {!isReadOnly && (
                                        <div className="flex justify-center mt-8 border-t border-neutral-700/50 pt-8">
                                            <button onClick={() => setCompareConfigs([...compareConfigs, [{ reportId: '', siteId: '' }, { reportId: '', siteId: '' }]])} className="bg-neutral-800 hover:bg-neutral-700 border border-neutral-600 text-emerald-400 px-6 py-3 rounded-lg font-bold transition-colors flex items-center gap-2 shadow-sm">
                                                <i className="fa-solid fa-layer-group"></i> Add New Comparison Set
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    {isCloudModalOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                            <div className="bg-neutral-900 rounded-lg p-6 max-w-2xl w-full border border-neutral-700 shadow-2xl">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold text-white">Cloud Reports</h2>
                                    <button onClick={() => setIsCloudModalOpen(false)} className="text-neutral-400 hover:text-white text-xl">✕</button>
                                </div>
                                <div className="max-h-96 overflow-y-auto pr-2">
                                    {cloudReports.length === 0 ? <p className="text-neutral-400 text-center py-4">No reports found.</p> : (
                                        <div className="flex flex-col gap-3">
                                            {cloudReports.map(report => (
                                                <div key={report.id} className="p-4 bg-neutral-800 rounded-lg flex justify-between items-center border border-neutral-700 hover:border-neutral-500 transition">
                                                    <div>
                                                        <h3 className="font-bold text-sky-400">{report.title}</h3>
                                                        <p className="text-sm text-neutral-400">Saved: {new Date(report.updated_at).toLocaleDateString()}</p>
                                                    </div>
                                                    <button onClick={() => loadFromCloud(report.id)} className="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded font-bold transition">
                                                        Load
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
